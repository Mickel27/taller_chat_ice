plugins {
    id 'com.zeroc.gradle.ice-builder.slice' version '1.5.0' apply false
    id 'java'
}

allprojects {
    group = 'com.chat'
    version = '1.0.0'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'

    java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    tasks.withType(JavaCompile) {
        options.encoding = 'UTF-8'
    }
}

task runServer(type: GradleBuild) {
    description = 'Ejecuta el servidor ZeroC Ice'
    buildFile = file('server/build.gradle')
    tasks = ['run']
}

task runClient(type: GradleBuild) {
    description = 'Ejecuta el cliente del sistema'
    buildFile = file('client/build.gradle')
    tasks = ['run']
}